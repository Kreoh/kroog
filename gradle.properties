#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx8192M

# Build JS targets using npm package manager https://kotlinlang.org/docs/js-project-setup.html#npm-dependencies
kotlin.js.yarn=false

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true

kotlin.native.ignoreDisabledTargets=true

android.useAndroidX=true

group=com.kreoh.kroog
# Base matches incorporated Koog; the suffix identifies the Kroog revision.
version=1.3.0-kroog.2
