import java.security.MessageDigest

gradle.projectsEvaluated {
    if (gradle.parent != null) return
    def root = gradle.rootProject
    def manifest = root.file('build/ci/lint-files')
    def paths = manifest.getText('UTF-8').split('\u0000').findAll { it }.unique().sort()
    def changedFiles = paths.collect { root.file(it).canonicalFile }.toSet()
    def selection = MessageDigest.getInstance('SHA-256').digest(paths.join('\u0000').getBytes('UTF-8')).encodeHex()
    def projects = root.allprojects.findAll { project ->
        def directory = project.projectDir.canonicalFile.toPath()
        changedFiles.any { it.toPath().startsWith(directory) }
    }
    ['ktlintCheck', 'ktlintFormat'].each { taskName ->
        root.tasks.register("${taskName}Changed") {
            dependsOn projects.collect { it.tasks.named(taskName) }
        }
    }
    root.configure(projects) {
        def lint = extensions.findByName('ktlint')
        if (lint != null) {
            lint.filter {
                exclude { entry -> !entry.directory && !changedFiles.contains(entry.file.canonicalFile) }
            }
            // ktlint-gradle reprocesses paths from previous errors and format snapshots even when its source filter changes.
            tasks.matching { it.name.startsWith('runKtlint') }.configureEach { task ->
                def state = layout.buildDirectory.dir("intermediates/ktLint/changed/${selection}/${task.name}")
                task.'discoveredErrors$ktlint_gradle'.set(state.map { it.file('errors.bin') })
                if (task.name.startsWith('runKtlintFormat')) {
                    task.'previousRunSnapshot$ktlint_gradle'.set(state.map { it.file('format.bin') })
                }
            }
        }
    }
}
