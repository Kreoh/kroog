import org.gradle.api.artifacts.VersionCatalogsExtension
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.component.ProjectComponentIdentifier
import org.gradle.api.attributes.Category
import org.gradle.api.attributes.LibraryElements
import org.gradle.api.attributes.Usage
import org.gradle.api.publish.PublishingExtension
import org.gradle.api.publish.maven.MavenPublication

gradle.projectsEvaluated {
    if (gradle.parent != null) {
        return
    }
    def root = gradle.rootProject
    def baseline = root.findProperty('kroogAbiBaseline')
    if (!(baseline ==~ /\d+\.\d+\.\d+-kroog\.\d+/)) {
        throw new GradleException('Set -PkroogAbiBaseline to a published Kroog release version')
    }

    def inventory = root.file('gradle/kroog-jvm-publications.txt').readLines('UTF-8').collectEntries { line ->
        if (!(line ==~ /(?:jvm|maven) (?::[a-z0-9][a-z0-9-]*)+/)) {
            throw new GradleException("Invalid JVM publication: ${line}")
        }
        def (kind, path) = line.split(' ')
        [(path): kind]
    }
    def paths = root.findProperty('kroogAbiProjects')?.split(',')?.toList() ?: inventory.keySet()
    def publications = paths.collect { path ->
        if (!inventory.containsKey(path)) {
            throw new GradleException("Project is outside the JVM publication inventory: ${path}")
        }
        def project = root.project(path)
        if (project.ext.isBeta == true) {
            root.logger.lifecycle("Skipping beta JVM ABI: ${path}")
            return null
        }
        def kind = inventory[path]
        def publication = project.extensions.getByType(PublishingExtension).publications.named(kind, MavenPublication).get()
        def runtimeClasspath = project.configurations.named(kind == 'jvm' ? 'jvmRuntimeClasspath' : 'runtimeClasspath')
        [publication: publication, runtimeClasspath: runtimeClasspath]
    }.findAll { it != null }
    if (publications.isEmpty()) {
        throw new GradleException('No stable JVM publications selected for ABI validation')
    }

    def artifacts = publications.collectEntries { entry ->
        def publication = entry.publication
        def jars = publication.artifacts.findAll { it.extension == 'jar' && !it.classifier }
        if (jars.size() != 1) {
            throw new GradleException("Expected one JVM JAR for ${publication.artifactId}")
        }
        def coordinate = "${publication.groupId}:${publication.artifactId}:${baseline}".toString()
        def previousJar = root.configurations.detachedConfiguration(root.dependencies.create("${coordinate}@jar"))
        def previousClasspath = root.configurations.detachedConfiguration(root.dependencies.create(coordinate))
        previousClasspath.attributes.attribute(Usage.USAGE_ATTRIBUTE, root.objects.named(Usage, Usage.JAVA_RUNTIME))
        previousClasspath.attributes.attribute(Category.CATEGORY_ATTRIBUTE, root.objects.named(Category, Category.LIBRARY))
        previousClasspath.attributes.attribute(
            LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, root.objects.named(LibraryElements, LibraryElements.JAR)
        )
        [(coordinate): [
            groupId: publication.groupId,
            currentJar: jars.first(),
            currentClasspath: entry.runtimeClasspath,
            previousJar: previousJar,
            previousClasspath: previousClasspath
        ]]
    }

    def kotlinVersion = root.extensions.getByType(VersionCatalogsExtension)
        .named('libs').findVersion('kotlin').get().requiredVersion
    def abiToolsClasspath = root.configurations.detachedConfiguration(
        root.dependencies.create("org.jetbrains.kotlin:abi-tools:${kotlinVersion}"),
        root.dependencies.create('com.github.siom79.japicmp:japicmp:0.27.0:jar-with-dependencies@jar')
    )
    abiToolsClasspath.attributes.attribute(Usage.USAGE_ATTRIBUTE, root.objects.named(Usage, Usage.JAVA_RUNTIME))

    def checkerTest = root.tasks.register('testKroogJvmAbiCheck', Exec) {
        group = 'verification'
        description = 'Exercise the JVM compatibility checker with compiled fixture JARs.'
        doFirst {
            commandLine 'bash', root.file('.github/scripts/test-jvm-abi.sh'),
                System.getProperty('java.home'), abiToolsClasspath.asPath
        }
    }

    root.tasks.register('checkKroogJvmAbi', JavaExec) {
        group = 'verification'
        description = 'Check stable JVM publications against a previous Kroog release.'
        dependsOn checkerTest
        dependsOn artifacts.values().collectMany { [it.currentJar.buildDependencies, it.currentClasspath.get().buildDependencies] }
        // Gradle embeds an older Kotlin runtime than the ABI reader requires.
        classpath = abiToolsClasspath
        mainClass = root.file('.github/scripts/KroogJvmAbiCheck.java').absolutePath
        doFirst {
            def comparisons = new File(temporaryDir, 'comparisons.tsv')
            def rows = artifacts.collect { coordinate, artifact ->
                def currentClasspath = artifact.currentClasspath.get()
                def apiDependencies = [artifact.previousClasspath, currentClasspath].collectMany { configuration ->
                    configuration.incoming.artifacts.artifacts.findResults { dependency ->
                        def component = dependency.id.componentIdentifier
                        if (component instanceof ProjectComponentIdentifier ||
                            component instanceof ModuleComponentIdentifier && component.group == artifact.groupId) {
                            return dependency.file.absolutePath
                        }
                        null
                    }
                }.unique().join(File.pathSeparator)
                [
                    coordinate,
                    artifact.previousJar.singleFile.absolutePath,
                    artifact.currentJar.file.absolutePath,
                    artifact.previousClasspath.asPath,
                    currentClasspath.asPath,
                    apiDependencies
                ].join('\t')
            }
            comparisons.setText(rows.join('\n'), 'UTF-8')
            args comparisons.absolutePath
        }
    }
}
