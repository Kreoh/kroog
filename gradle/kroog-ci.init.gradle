// Apply limits after the repository conventions have configured test tasks.
gradle.projectsEvaluated {
    gradle.rootProject.allprojects {
        tasks.withType(Test).configureEach {
            failFast = true
            maxParallelForks = 1
            jvmArgs '-XX:ActiveProcessorCount=2'
            if (name == 'test') {
                // The Java plugin's test task owns the compiled JVM test classes.
                useJUnitPlatform()
                filter {
                    excludeTestsMatching '*.integration_*'
                    excludeTestsMatching '*.ollama_*'
                }
            }
        }
    }

    gradle.rootProject.findProject(':a2a:a2a-client')?.tasks?.named('jvmTest') {
        inputs.dir(gradle.rootProject.file('a2a/test-python-a2a-server')).withPathSensitivity(PathSensitivity.RELATIVE)
    }
}
