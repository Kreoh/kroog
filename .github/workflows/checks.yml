name: JVM checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  jvm:
    name: JVM build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and test published JVM modules
        run: bash .github/scripts/check-jvm.sh
      - name: Check JVM binary compatibility
        run: >-
          ./gradlew --init-script gradle/kroog-jvm-abi.init.gradle
          -PkroogAbiBaseline=1.3.0-kroog.8 :checkKroogJvmAbi
          --max-workers=2 --no-daemon -Pkotlin.compiler.execution.strategy=in-process
      - name: Collect reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jvm-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  lint:
    name: Kotlin lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Lint changed Kotlin files
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: bash .github/scripts/check-lint.sh "$BASE_REF"

  result:
    name: JVM checks result
    needs: [jvm, lint]
    if: always()
    runs-on: ubuntu-slim
    steps:
      - name: Require every check to pass
        env:
          JVM_RESULT: ${{ needs.jvm.result }}
          LINT_RESULT: ${{ needs.lint.result }}
        run: test "$JVM_RESULT" = success && test "$LINT_RESULT" = success
