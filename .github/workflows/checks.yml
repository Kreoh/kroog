name: JVM checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: JVM checks result
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check for Kotlin or JVM inputs
        id: inputs
        run: |
          manifest="$RUNNER_TEMP/kroog-check-inputs"
          bash .github/scripts/changed-files.sh "$BASE_REF" kotlin > "$manifest"
          bash .github/scripts/changed-files.sh "$BASE_REF" jvm >> "$manifest"
          bash .github/scripts/changed-files.sh "$BASE_REF" selector >> "$manifest"
          if [[ -s "$manifest" ]]; then echo 'gradle=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-java@v5
        if: steps.inputs.outputs.gradle == 'true'
        with:
          distribution: corretto
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
        if: steps.inputs.outputs.gradle == 'true'
      - name: Lint changed Kotlin files
        run: bash .github/scripts/check-lint.sh "$BASE_REF"
      - name: Run affected JVM tests
        run: bash .github/scripts/check-jvm.sh --base "$BASE_REF" --profile
      - name: Collect reports
        if: ${{ !cancelled() && steps.inputs.outputs.gradle == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: jvm-reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
