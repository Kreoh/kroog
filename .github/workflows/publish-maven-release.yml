name: Publish Maven release

'on':
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Exact annotated release tag matching the stable Gradle version'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-maven-release
  cancel-in-progress: false

jobs:
  release:
    name: Prepare Kroog Maven Central release
    if: github.repository == 'Kreoh/kroog'
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Configure Git
        run: git config --global core.autocrlf input

      - name: Verify workflow dispatch source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_REF_NAME: ${{ github.ref_name }}
          DISPATCH_REF_TYPE: ${{ github.ref_type }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$REQUESTED_RELEASE_TAG" ]]; then
            echo "Enter the exact annotated release tag in the release_tag input." >&2
            exit 1
          fi
          if [[ ! "$REQUESTED_RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+-kroog\.[0-9]+$ ]]; then
            echo "release_tag must use the stable MAJOR.MINOR.PATCH-kroog.REVISION format, for example 1.1.1-kroog.1." >&2
            exit 1
          fi
          tag_ref="refs/tags/$REQUESTED_RELEASE_TAG"
          if ! git check-ref-format "$tag_ref"; then
            echo "release_tag must be the exact name of a valid annotated release tag." >&2
            exit 1
          fi
          case "$DISPATCH_REF_TYPE" in
            branch)
              default_branch_ref="refs/heads/$DEFAULT_BRANCH"
              if [[ -z "$DEFAULT_BRANCH" || "$DISPATCH_REF_NAME" != "$DEFAULT_BRANCH" || "$DISPATCH_REF" != "$default_branch_ref" ]]; then
                echo "Browser dispatches must select the repository default branch and enter the exact annotated release tag." >&2
                exit 1
              fi
              ;;
            tag)
              if [[ "$DISPATCH_REF_NAME" != "$REQUESTED_RELEASE_TAG" || "$DISPATCH_REF" != "$tag_ref" ]]; then
                echo "Tag-ref dispatches must use the same exact annotated tag as the release_tag input." >&2
                exit 1
              fi
              ;;
            *)
              echo "Dispatch from the repository default branch, or from the same exact tag supplied as release_tag." >&2
              exit 1
              ;;
          esac

      - name: Checkout immutable release commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: refs/tags/${{ inputs.release_tag }}

      - name: Verify release tag and version
        id: release
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_REF_NAME: ${{ github.ref_name }}
          DISPATCH_REF_TYPE: ${{ github.ref_type }}
          DISPATCH_SHA: ${{ github.sha }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t configured_versions < <(sed -n 's/^version=//p' gradle.properties)
          if [[ "${#configured_versions[@]}" -ne 1 ]]; then
            echo "gradle.properties must contain one stable release version." >&2
            exit 1
          fi
          configured_version="${configured_versions[0]}"
          if [[ -z "$configured_version" || "$configured_version" == *-SNAPSHOT ]]; then
            echo "gradle.properties must contain one stable release version." >&2
            exit 1
          fi
          if [[ ! "$configured_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-kroog\.[0-9]+$ ]]; then
            echo "The stable Gradle version must use the MAJOR.MINOR.PATCH-kroog.REVISION format." >&2
            exit 1
          fi
          if [[ "$REQUESTED_RELEASE_TAG" != "$configured_version" ]]; then
            echo "release_tag must exactly match the stable Gradle version: $configured_version" >&2
            exit 1
          fi

          tag_ref="refs/tags/$configured_version"
          if ! git show-ref --verify --quiet -- "$tag_ref"; then
            echo "The exact release tag $tag_ref is absent from the checkout." >&2
            exit 1
          fi
          tag_type="$(git cat-file -t "$tag_ref")"
          if [[ "$tag_type" != "tag" ]]; then
            echo "$tag_ref must be an annotated tag; lightweight release tags are rejected." >&2
            exit 1
          fi

          local_tag_object="$(git rev-parse --verify --end-of-options "$tag_ref")"
          tag_commit="$(git rev-parse --verify --end-of-options "${tag_ref}^{commit}")"
          head_commit="$(git rev-parse --verify HEAD)"
          if [[ "$head_commit" != "$tag_commit" ]]; then
            echo "The checked-out HEAD does not equal the release tag's peeled commit." >&2
            exit 1
          fi

          remote_output="$(git ls-remote --refs origin "$tag_ref")" || {
            echo "Could not verify the exact release tag on origin." >&2
            exit 1
          }
          remote_matches=()
          while IFS= read -r remote_line; do
            [[ -n "$remote_line" ]] && remote_matches+=("$remote_line")
          done <<< "$remote_output"
          if [[ "${#remote_matches[@]}" -ne 1 ]]; then
            echo "origin must contain exactly one $tag_ref object; found ${#remote_matches[@]}." >&2
            exit 1
          fi
          IFS=$'\t' read -r remote_tag_object remote_tag_ref extra <<< "${remote_matches[0]}"
          if [[ -n "${extra:-}" || "$remote_tag_ref" != "$tag_ref" || "$remote_tag_object" != "$local_tag_object" ]]; then
            echo "The exact annotated tag object on origin does not match the local release tag object." >&2
            exit 1
          fi

          if [[ "$DISPATCH_REF_TYPE" == "tag" ]]; then
            if [[ "$DISPATCH_REF" != "$tag_ref" || "$DISPATCH_REF_NAME" != "$configured_version" || "$DISPATCH_SHA" != "$tag_commit" ]]; then
              echo "The tag-ref dispatch context does not match the exact release tag and peeled commit." >&2
              exit 1
            fi
          fi

          if [[ "$DISPATCH_REF_TYPE" != "branch" && "$DISPATCH_REF_TYPE" != "tag" ]]; then
            echo "The verified dispatch source must be a branch or tag." >&2
            exit 1
          fi
          echo "release_tag=$configured_version" >> "$GITHUB_OUTPUT"

      - name: Verify release signing key
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$MAVEN_GPG_PRIVATE_KEY" ]]; then
            echo "MAVEN_GPG_PRIVATE_KEY is required but is not set." >&2
            exit 1
          fi

      - name: Set up JDK 21 and release signing key
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: 21
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build exact signed JVM release closure
        env:
          BRANCH_KOOG_IS_RELEASING_FROM: release/${{ steps.release.outputs.release_tag }}
          KOOG_GITHUB_RELEASE: 'true'
        shell: bash
        run: |
          set -euo pipefail
          inventory=gradle/kroog-jvm-publications.txt
          mapfile -t publications < "$inventory"
          [[ "${#publications[@]}" -eq 87 ]]

          local_tasks=()
          jvm_count=0
          maven_count=0
          for publication in "${publications[@]}"; do
            read -r kind project extra <<< "$publication"
            [[ -z "${extra:-}" && "$project" =~ ^(:[a-z0-9][a-z0-9-]*)+$ ]]
            case "$kind" in
              jvm)
                local_tasks+=("${project}:publishJvmPublicationToArtifactsRepository")
                ((++jvm_count))
                ;;
              maven)
                local_tasks+=("${project}:publishMavenPublicationToArtifactsRepository")
                ((++maven_count))
                ;;
              *)
                echo "Unsupported publication kind: $kind" >&2
                exit 1
                ;;
            esac
          done
          [[ "$jvm_count" -eq 69 && "$maven_count" -eq 18 ]]
          ./gradlew \
            "${local_tasks[@]}" \
            --no-parallel \
            --no-daemon \
            --stacktrace

      - name: Verify Central Portal credentials
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for secret_name in CENTRAL_PORTAL_USERNAME CENTRAL_PORTAL_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "$secret_name is required but is not set." >&2
              exit 1
            fi
          done

      - name: Assemble Maven Central bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          source_root="build/artifacts/maven/com/kreoh/kroog"
          bundle_root="build/central-bundle/com/kreoh/kroog"
          coordinates_file="build/release-coordinates.txt"
          copy_coordinate() {
            local pom="$1"
            local version_directory artifact version
            version_directory="$(dirname "$pom")"
            artifact="$(basename "$(dirname "$version_directory")")"
            version="$(basename "$version_directory")"
            local source_directory="$source_root/$artifact/$version"
            local bundle_directory="$bundle_root/$artifact/$version"
            local primary
            [[ "$pom" == "$source_directory/$artifact-$version.pom" ]]
            grep -Fq "<groupId>com.kreoh.kroog</groupId>" "$pom"
            grep -Fq "<artifactId>$artifact</artifactId>" "$pom"
            grep -Fq "<version>$version</version>" "$pom"
            mkdir -p "$bundle_directory"
            for primary in \
              "$artifact-$version.jar" \
              "$artifact-$version-sources.jar" \
              "$artifact-$version-javadoc.jar" \
              "$artifact-$version.pom"
            do
              for suffix in '' .asc .md5 .sha1; do
                test -s "$source_directory/$primary$suffix"
                cp "$source_directory/$primary$suffix" "$bundle_directory/"
              done
            done
            printf '%s|%s\n' "$artifact" "$version" >> "$coordinates_file"
          }
          : > "$coordinates_file"
          mapfile -d '' -t staged_poms < <(
            find "$source_root" -mindepth 3 -maxdepth 3 -type f -name '*.pom' -print0 | sort -z
          )
          [[ "${#staged_poms[@]}" -eq 87 ]]
          for pom in "${staged_poms[@]}"; do
            copy_coordinate "$pom"
          done
          (
            cd build/central-bundle
            zip -q -r ../kroog-maven-central-bundle.zip com
          )
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Preserve Maven Central bundle
        if: always() && steps.bundle.outputs.created == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: kroog-maven-central-bundle-${{ steps.release.outputs.release_tag }}
          path: build/kroog-maven-central-bundle.zip
          if-no-files-found: error
          retention-days: 30

      - name: Validate exact Maven Central bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="build/central-bundle/com/kreoh/kroog"
          coordinates_file="build/release-coordinates.txt"
          validate_coordinate() {
            local artifact="$1"
            local version="$2"
            local directory="$bundle_root/$artifact/$version"
            local primary
            test -d "$directory"
            for primary in \
              "$artifact-$version.jar" \
              "$artifact-$version-sources.jar" \
              "$artifact-$version-javadoc.jar" \
              "$artifact-$version.pom"
            do
              local file="$directory/$primary"
              test -s "$file"
              gpg --batch --verify "$file.asc" "$file"
              [[ "$(cut -d ' ' -f 1 "$file.md5")" == "$(md5sum "$file" | cut -d ' ' -f 1)" ]]
              [[ "$(cut -d ' ' -f 1 "$file.sha1")" == "$(sha1sum "$file" | cut -d ' ' -f 1)" ]]
            done
            jar tf "$directory/$artifact-$version.jar" >/dev/null
            jar tf "$directory/$artifact-$version-sources.jar" >/dev/null
            jar tf "$directory/$artifact-$version-javadoc.jar" >/dev/null
            grep -Fq "<artifactId>$artifact</artifactId>" "$directory/$artifact-$version.pom"
            grep -Fq "<version>$version</version>" "$directory/$artifact-$version.pom"
          }
          [[ "$(wc -l < "$coordinates_file")" -eq 87 ]]
          while IFS='|' read -r artifact version; do
            validate_coordinate "$artifact" "$version"
          done < "$coordinates_file"
          [[ "$(find "$bundle_root" -mindepth 2 -maxdepth 2 -type d | wc -l)" -eq 87 ]]
          [[ "$(find "$bundle_root" -type f | wc -l)" -eq 1392 ]]
          unzip -t build/kroog-maven-central-bundle.zip >/dev/null

      - name: Upload user-managed deployment to Central Portal
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          portal_token="$(printf '%s:%s' "$CENTRAL_PORTAL_USERNAME" "$CENTRAL_PORTAL_PASSWORD" | base64 --wrap=0)"
          echo "::add-mask::$portal_token"
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --url-query "name=kroog-$RELEASE_TAG" \
            --url-query 'publishingType=USER_MANAGED' \
            --header "Authorization: Bearer $portal_token" \
            --form bundle=@build/kroog-maven-central-bundle.zip \
            --write-out 'Central Portal accepted the user-managed bundle (HTTP %{http_code}).\n' \
            'https://central.sonatype.com/api/v1/publisher/upload'
