name: Publish Maven snapshot

'on':
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-maven-snapshot
  cancel-in-progress: false

jobs:
  publish:
    name: Publish JVM Maven snapshot artefacts
    if: github.repository == 'Kreoh/kroog' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Configure Git
        run: git config --global core.autocrlf input

      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Stage complete JVM snapshot closure locally
        shell: bash
        run: |
          set -euo pipefail
          inventory=gradle/kroog-jvm-publications.txt
          mapfile -t publications < "$inventory"
          [[ "${#publications[@]}" -eq 87 ]]

          local_tasks=()
          jvm_count=0
          maven_count=0
          for publication in "${publications[@]}"; do
            read -r kind project extra <<< "$publication"
            [[ -z "${extra:-}" && "$project" =~ ^(:[a-z0-9][a-z0-9-]*)+$ ]]
            case "$kind" in
              jvm)
                local_tasks+=("${project}:publishJvmPublicationToArtifactsRepository")
                ((++jvm_count))
                ;;
              maven)
                local_tasks+=("${project}:publishMavenPublicationToArtifactsRepository")
                ((++maven_count))
                ;;
              *)
                echo "Unsupported publication kind: $kind" >&2
                exit 1
                ;;
            esac
          done
          [[ "$jvm_count" -eq 69 && "$maven_count" -eq 18 ]]
          ./gradlew \
            "${local_tasks[@]}" \
            --no-parallel \
            --no-daemon \
            --stacktrace

          staged_root="build/artifacts/maven/com/kreoh/kroog"
          mapfile -d '' -t staged_poms < <(
            find "$staged_root" -mindepth 3 -maxdepth 3 -type f -name '*.pom' -print0 | sort -z
          )
          [[ "${#staged_poms[@]}" -eq 87 ]]
          [[ "$(find "$staged_root" -type f | wc -l)" -eq 1392 ]]

      - name: Verify Central Portal credentials
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
        run: |
          if [[ -z "$CENTRAL_PORTAL_USERNAME" ]]; then
            echo "CENTRAL_PORTAL_USERNAME is required but is not set." >&2
            exit 1
          fi
          if [[ -z "$CENTRAL_PORTAL_PASSWORD" ]]; then
            echo "CENTRAL_PORTAL_PASSWORD is required but is not set." >&2
            exit 1
          fi

      - name: Publish exact JVM snapshot closure
        env:
          ORG_GRADLE_PROJECT_centralPortalSnapshotsUsername: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          ORG_GRADLE_PROJECT_centralPortalSnapshotsPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
        run: |
          ./gradlew \
            publishJvmPublicationToCentralPortalSnapshotsRepository \
            publishMavenPublicationToCentralPortalSnapshotsRepository \
            -PpublishCentralSnapshots=true \
            --no-parallel \
            --no-daemon \
            --stacktrace
